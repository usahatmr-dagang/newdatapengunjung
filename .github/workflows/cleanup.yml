name: Auto Cleanup Old Runs

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap jam 12 malam (UTC)
  workflow_dispatch: # Bisa dijalankan manual jika mau

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Menghapus Riwayat Actions Lama
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0        # 0 = hapus semua tanpa mempedulikan umur harinya
          keep_minimum_runs: 10 # TAPI tetap sisakan 10 riwayat paling baru
